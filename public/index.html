<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0d10">
  <title>Timeline</title>
  <link rel="icon" href="/icone.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/estilo.css">
</head>
<body>
  <header class="barra">
    <a class="marca" href="#/agora" aria-label="Timeline, início">
      <span class="marca-ponto" aria-hidden="true"></span>
      <span class="marca-nome">timeline</span>
    </a>
    <form class="busca" id="form-busca" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 1 0 3.87 10.59l4.27 4.27 1.41-1.41-4.27-4.27A6 6 0 0 0 10 4zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
      <input id="busca" type="search" placeholder="Buscar vídeo, canal ou assunto" autocomplete="off" aria-label="Buscar">
      <kbd>/</kbd>
    </form>
    <div class="barra-acoes">
      <span class="status" id="status"></span>
      <a class="redondo so-estreito" href="#/ajustes" title="Ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2zm0-12v2h10V5zm10 16v-2h8v-2h-8v-2h-2v6zM7 9v2H3v2h4v2h2V9zm14 4v-2H11v2zm-6-4h2V7h4V5h-4V3h-2z"/></svg></a>
      <button class="redondo" id="btn-atualizar" title="Buscar vídeos novos agora (r)" aria-label="Atualizar">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>
  </header>

  <nav class="trilho" id="trilho" aria-label="Seções">
    <a href="#/agora" data-v="agora"><svg viewBox="0 0 24 24"><path d="M12 2 9.2 8.6 2 9.2l5.5 4.7L5.8 21 12 17.3 18.2 21l-1.7-7.1L22 9.2l-7.2-.6z"/></svg><span>Agora</span></a>
    <a href="#/recentes" data-v="recentes"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 10.6 3.2 1.9-.8 1.3-4.4-2.6V7h2z"/></svg><span>Recentes</span></a>
    <a href="#/fila" data-v="fila"><svg viewBox="0 0 24 24"><path d="M4 6h12v2H4zm0 5h12v2H4zm0 5h8v2H4zm14-2v-4h2v4h3v2h-3v4h-2v-4h-3v-2z"/></svg><span>Fila</span><b class="conta" id="n-fila"></b></a>
    <a href="#/continuar" data-v="continuar"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>Continuar</span><b class="conta" id="n-continuar"></b></a>
    <a href="#/historico" data-v="historico"><svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg><span>Vistos</span></a>
    <a href="#/canais" data-v="canais"><svg viewBox="0 0 24 24"><path d="M3 5h18v12H3zm2 2v8h14V7zm-1 12h16v2H4zm6-10 5 3-5 3z"/></svg><span>Canais</span></a>
    <a href="#/ajustes" data-v="ajustes" class="so-largo"><svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2zm0-12v2h10V5zm10 16v-2h8v-2h-8v-2h-2v6zM7 9v2H3v2h4v2h2V9zm14 4v-2H11v2zm-6-4h2V7h4V5h-4V3h-2z"/></svg><span>Ajustes</span></a>
  </nav>

  <main class="palco" id="palco">
    <div class="cabeca" id="cabeca"></div>
    <div class="filtros" id="filtros"></div>
    <div id="destaque"></div>
    <div id="lista" class="lista"></div>
    <div id="sentinela"></div>
  </main>

  <div class="player" id="player" hidden>
    <div class="player-topo">
      <button class="redondo" id="pl-fechar" title="Fechar (Esc)" aria-label="Fechar">
        <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <div class="player-caixa">
      <div class="player-esq">
        <div class="player-video"><div id="yt-alvo"></div></div>
        <div class="pl-info">
          <h2 id="pl-titulo"></h2>
          <p class="pl-meta"><a id="pl-canal"></a> <span id="pl-meta"></span></p>
          <div class="pl-botoes">
            <button class="btn forte" id="pl-visto-prox">✓ Vi · próximo</button>
            <button class="btn" id="pl-depois">⏱ Fila</button>
            <button class="btn" id="pl-menos">✕ Menos disso</button>
            <a class="btn" id="pl-yt" target="_blank" rel="noopener">Abrir no YouTube ↗</a>
            <div class="segmentos" id="pl-vel"></div>
          </div>
        </div>
      </div>
      <aside class="player-lado">
        <h3>A seguir</h3>
        <div id="pl-fila" class="pl-fila"></div>
      </aside>
    </div>
  </div>

  <div class="folha" id="folha" hidden>
    <div class="folha-caixa">
      <div class="folha-topo"><h3 id="folha-titulo"></h3><button class="redondo" id="folha-fechar" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button></div>
      <div id="folha-corpo"></div>
    </div>
  </div>

  <div class="menu-flutuante" id="menu" hidden></div>
  <div class="avisos" id="avisos"></div>

  <script src="/app.js" type="module"></script>
  <script nomodule>document.body.textContent = "Este navegador é antigo demais para a Timeline.";</script>
</body>
</html>
